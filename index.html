};

// ============ RANDOM OBSERVATION GENERATOR ============
// pickOne returns a single item, pickN always returns an array
const pickOne = (arr) => arr[Math.floor(Math.random() * arr.length)];
const pickN = (arr, min = 1, max = 2) => {
  const n = min + Math.floor(Math.random() * (max - min + 1));
  const shuffled = [...arr].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, Math.min(n, arr.length));
};

// ============ MULTI SELECT COMPONENT ============
function MultiSelect({ options, selected, onChange, placeholder }) {
  const [open, setOpen] = useState(false);
  const [custom, setCustom] = useState('');
  const ref = useRef(null);

  useEffect(() => {
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, []);

  const toggle = (opt) => {
    if (selected.includes(opt)) onChange(selected.filter(s => s !== opt));
    else onChange([...selected, opt]);
  };
  const addCustom = () => {
    if (custom.trim() && !selected.includes(custom.trim())) {
      onChange([...selected, custom.trim()]);
      setCustom('');
    }
  };

  return (
    <div ref={ref} className="relative">
      <div
        className="border rounded-lg p-2 min-h-10 cursor-pointer bg-white flex flex-wrap gap-1 items-center"
        onClick={() => setOpen(!open)}
      >
        {selected.length === 0 && <span className="text-gray-400 text-sm">{placeholder}</span>}
        {selected.map(s => (
          <span key={s} className="badge bg-blue-100 text-blue-800">
            {s}
            <button className="ml-1 text-blue-600 hover:text-blue-800" onClick={(e) => { e.stopPropagation(); toggle(s); }}>&times;</button>
          </span>
        ))}
      </div>
      {open && (
        <div className="absolute z-50 mt-1 w-full bg-white border rounded-lg shadow-lg max-h-60 overflow-y-auto">
          <div className="p-2 border-b flex gap-1">
            <input
              className="flex-1 border rounded px-2 py-1 text-sm"
              placeholder="Додати своє..."
              value={custom}
              onChange={e => setCustom(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && addCustom()}
              onClick={e => e.stopPropagation()}
            />
            <button onClick={(e) => { e.stopPropagation(); addCustom(); }} className="text-sm bg-blue-500 text-white px-2 rounded">+</button>
          </div>
          {options.map(opt => (
            <label key={opt} className="flex items-center px-3 py-2 hover:bg-gray-50 cursor-pointer text-sm" onClick={e => e.stopPropagation()}>
              <input type="checkbox" checked={selected.includes(opt)} onChange={() => toggle(opt)} className="mr-2 rounded"/>
              {opt}
            </label>
          ))}
        </div>
      )}
    </div>
  );
}

                    <p className="text-sm text-gray-500">{s.className} клас</p>
                  </div>
                  <span className="badge bg-purple-100 text-purple-700">{s.category ? s.category.split(' ').slice(0,2).join(' ') : 'ООП'}</span>
                </div>
                <div className="mt-3 text-xs text-gray-400 space-y-1">
                  <p>Асистент: {s.assistantName}</p>
                  <p>Програма: {s.programType}</p>
                </div>
              </div>
              <div className="flex border-t divide-x">
                <button onClick={e => { e.stopPropagation(); onEdit(s); }} className="flex-1 py-2 text-sm text-blue-600 hover:bg-blue-50 flex items-center justify-center gap-1">{Icons.edit} Редагувати</button>
                <button onClick={e => { e.stopPropagation(); setConfirm(s.id); }} className="flex-1 py-2 text-sm text-red-500 hover:bg-red-50 flex items-center justify-center gap-1">{Icons.trash} Видалити</button>
              </div>
            </div>
          ))}
        </div>
      )}
      <ConfirmDialog open={!!confirm} onClose={() => setConfirm(null)} onConfirm={() => onDelete(confirm)} title="Видалити учня?" message="Усі спостереження цього учня також будуть видалені. Цю дію неможливо скасувати."/>
    </div>
  );
}

// ============ STUDENT DETAIL + OBSERVATIONS ============
function StudentDetail({ student, observations, onBack, onAddObs, onQuickObs, onEditObs, onDeleteObs, onPrint }) {
  const [tab, setTab] = useState('observations');
  const [dateFrom, setDateFrom] = useState('');
  const [dateTo, setDateTo] = useState('');
  const [subjectFilter, setSubjectFilter] = useState('');
  const [confirm, setConfirm] = useState(null);

  const filtered = observations
    .filter(o => o.studentId === student.id)
    .filter(o => !dateFrom || o.date >= dateFrom)
    .filter(o => !dateTo || o.date <= dateTo)
    .filter(o => !subjectFilter || o.subject === subjectFilter)
    .sort((a,b) => b.date.localeCompare(a.date) || (b.lessonNumber||0) - (a.lessonNumber||0));

  const subjectsUsed = [...new Set(observations.filter(o => o.studentId === student.id).map(o => o.subject))];

  const stats = useMemo(() => {
    const obs = observations.filter(o => o.studentId === student.id);
    const total = obs.length;
    const avgIndependence = total ? (obs.reduce((s,o) => s + (o.independence||3), 0) / total).toFixed(1) : 0;
    const emotions = {};
    obs.forEach(o => { if(o.emotionalState) emotions[o.emotionalState] = (emotions[o.emotionalState]||0) + 1; });
    const topEmotion = Object.entries(emotions).sort((a,b) => b[1]-a[1])[0];
    return { total, avgIndependence, topEmotion: topEmotion ? topEmotion[0] : '—' };
  }, [observations, student.id]);

  return (
    <div>
      <button onClick={onBack} className="flex items-center gap-1 text-blue-600 hover:text-blue-800 mb-4 text-sm">{Icons.back} Назад до списку</button>

      <div className="bg-white rounded-xl border p-4 mb-4">
        <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
          <div>
            <h2 className="text-xl font-bold text-gray-800">{student.lastName} {student.firstName} {student.middleName}</h2>
            <p className="text-sm text-gray-500">{student.className} клас &bull; {student.category || 'ООП'} &bull; {student.programType}</p>
            <p className="text-xs text-gray-400 mt-1">Асистент: {student.assistantName} &bull; Навч. рік: {student.schoolYear}</p>
          </div>
          <div className="flex gap-2">
            <button onClick={() => onPrint(student, filtered)} className="flex items-center gap-1 px-3 py-2 rounded-lg border text-gray-600 hover:bg-gray-50 text-sm">{Icons.print} Друк</button>
            <button onClick={onQuickObs} title="Створити чернетку спостереження на сьогодні з випадковими даними для редагування"
              className="flex items-center gap-1 bg-yellow-500 text-white px-3 py-2 rounded-lg hover:bg-yellow-600 text-sm">
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
              Швидкий запис
            </button>
            <button onClick={onAddObs} className="flex items-center gap-1 bg-green-600 text-white px-3 py-2 rounded-lg hover:bg-green-700 text-sm">{Icons.plus} Нове</button>
          </div>
        </div>
      </div>

      {/* Stats cards */}
      <div className="grid grid-cols-3 gap-3 mb-4">
        <div className="bg-white rounded-lg border p-3 text-center">
          <div className="text-2xl font-bold text-blue-600">{stats.total}</div>
          <div className="text-xs text-gray-500">Спостережень</div>
        </div>
        <div className="bg-white rounded-lg border p-3 text-center">
          <div className="text-2xl font-bold text-green-600">{stats.avgIndependence}</div>
          <div className="text-xs text-gray-500">Сер. самостійність</div>
        </div>
        <div className="bg-white rounded-lg border p-3 text-center">
          <div className="text-lg font-bold text-yellow-600">{stats.topEmotion}</div>
          <div className="text-xs text-gray-500">Частий стан</div>
        </div>
      </div>

      {/* Tabs */}
      <div className="flex border-b mb-4 overflow-x-auto no-print">
        {[['observations','Спостереження'],['profile','Профіль учня'],['analytics','Аналітика']].map(([k,v]) => (
          <button key={k} onClick={() => setTab(k)} className={`px-4 py-2 text-sm whitespace-nowrap ${tab===k ? 'tab-active' : 'text-gray-500 hover:text-gray-700'}`}>{v}</button>
        ))}
      </div>

      {tab === 'observations' && (
        <div>
          {/* Filters */}
          <div className="flex flex-col sm:flex-row gap-2 mb-4 bg-gray-100 p-3 rounded-lg">
            <input type="date" className="border rounded-lg px-3 py-1.5 text-sm bg-white" value={dateFrom} onChange={e => setDateFrom(e.target.value)} placeholder="Від"/>
            <input type="date" className="border rounded-lg px-3 py-1.5 text-sm bg-white" value={dateTo} onChange={e => setDateTo(e.target.value)} placeholder="До"/>
            <select className="border rounded-lg px-3 py-1.5 text-sm bg-white" value={subjectFilter} onChange={e => setSubjectFilter(e.target.value)}>
              <option value="">Всі предмети</option>
              {subjectsUsed.map(s => <option key={s}>{s}</option>)}
            </select>
            {(dateFrom || dateTo || subjectFilter) && (
              <button onClick={() => { setDateFrom(''); setDateTo(''); setSubjectFilter(''); }} className="text-sm text-red-500 hover:text-red-700">Скинути</button>
            )}
          </div>

          {filtered.length === 0 ? (
            <div className="text-center py-12 text-gray-400">
              <p className="text-lg">Спостережень ще немає</p>
              <p className="text-sm mt-1">Додайте перше спостереження за учнем</p>
            </div>
          ) : (
            <div className="space-y-3">
              {filtered.map(obs => (
                <div key={obs.id} className="bg-white rounded-lg border p-4 hover:shadow-sm transition-shadow">
                  <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-2">
                    <div className="flex-1">
                      <div className="flex flex-wrap items-center gap-2 mb-2">
                        <span className="font-medium text-gray-800">{formatDate(obs.date)}</span>
                        <span className="text-xs text-gray-400">{getDayName(obs.date)}</span>
                        {obs.lessonNumber && <span className="badge bg-gray-100 text-gray-600">Урок {obs.lessonNumber}</span>}
                        <span className="badge bg-blue-100 text-blue-700">{obs.subject}</span>
                        {obs.emotionalState && <span className="text-sm">{obs.emotionalState}</span>}
                      </div>
                      {obs.topic && <p className="text-sm text-gray-600 mb-2">Тема: {obs.topic}</p>}

                      <div className="flex flex-wrap gap-1 mb-2">
                        {obs.behavior?.map(b => <span key={b} className="badge bg-red-50 text-red-600">{b}</span>)}
                        {obs.learning?.map(l => <span key={l} className="badge bg-green-50 text-green-600">{l}</span>)}
                        {obs.social?.map(s => <span key={s} className="badge bg-purple-50 text-purple-600">{s}</span>)}
                      </div>

                      {obs.helpProvided?.length > 0 && (
                        <p className="text-xs text-gray-500">Допомога: {obs.helpProvided.join(', ')}</p>
                      )}
                      {obs.detailedNotes && <p className="text-sm text-gray-600 mt-2 italic">«{obs.detailedNotes}»</p>}
                      {obs.recommendations && <p className="text-sm text-orange-600 mt-1">Рек.: {obs.recommendations}</p>}

                      <div className="mt-2 flex items-center gap-1">
                        <span className="text-xs text-gray-400">Самостійність:</span>
                        {[1,2,3,4,5].map(i => (
                          <span key={i} className={`w-4 h-4 rounded-full inline-block ${i <= (obs.independence||3) ? 'bg-green-500' : 'bg-gray-200'}`}/>
                        ))}
                      </div>
                    </div>
                    <div className="flex sm:flex-col gap-2">
                      <button onClick={() => onEditObs(obs)} className="text-blue-600 hover:text-blue-800 p-1">{Icons.edit}</button>
                      <button onClick={() => setConfirm(obs.id)} className="text-red-500 hover:text-red-700 p-1">{Icons.trash}</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      {tab === 'profile' && (
        <div className="bg-white rounded-xl border p-6 space-y-4">
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-sm">
            {[
              ['ПІБ учня', `${student.lastName} ${student.firstName} ${student.middleName||''}`],
              ['Клас', student.className],
              ['Дата народження', student.dateOfBirth ? formatDate(student.dateOfBirth) : '—'],
              ['Категорія ООП', student.category || '—'],
              ['Тип програми', student.programType || '—'],
              ['Номер ІПР', student.iepNumber || '—'],
              ['Дата ІПР', student.iepDate ? formatDate(student.iepDate) : '—'],
              ['Асистент вчителя', student.assistantName],
              ['Навчальний рік', student.schoolYear],
              ['Батьки/опікуни', student.parentName || '—'],
              ['Телефон батьків', student.parentPhone || '—'],
            ].map(([label, val]) => (
              <div key={label}><span className="text-gray-500">{label}:</span> <span className="font-medium text-gray-800 ml-1">{val}</span></div>
            ))}
          </div>
          {student.notes && (
            <div className="border-t pt-3">
              <span className="text-sm text-gray-500">Примітки:</span>
              <p className="text-sm text-gray-800 mt-1">{student.notes}</p>
            </div>
          )}
        </div>
      )}

      {tab === 'analytics' && <AnalyticsTab observations={observations.filter(o => o.studentId === student.id)}/>}

      <ConfirmDialog open={!!confirm} onClose={() => setConfirm(null)} onConfirm={() => onDeleteObs(confirm)} title="Видалити спостереження?" message="Цю дію неможливо скасувати."/>
    </div>
  );
}

// ============ ANALYTICS ============
function AnalyticsTab({ observations }) {
  if (observations.length < 2) return <div className="text-center py-12 text-gray-400">Потрібно мінімум 2 спостереження для аналітики</div>;

  const sorted = [...observations].sort((a,b) => a.date.localeCompare(b.date));

  // Independence over time
  const indData = sorted.map(o => ({ date: formatDate(o.date), val: o.independence || 3, subject: o.subject }));

  // Subject frequency
  const subjCount = {};
  observations.forEach(o => { subjCount[o.subject] = (subjCount[o.subject]||0) + 1; });
  const subjEntries = Object.entries(subjCount).sort((a,b) => b[1]-a[1]);

  // Behavior frequency
  const behCount = {};
  observations.forEach(o => o.behavior?.forEach(b => { behCount[b] = (behCount[b]||0)+1; }));
  const behEntries = Object.entries(behCount).sort((a,b) => b[1]-a[1]).slice(0,8);

  // Help frequency
  const helpCount = {};
  observations.forEach(o => o.helpProvided?.forEach(h => { helpCount[h] = (helpCount[h]||0)+1; }));
  const helpEntries = Object.entries(helpCount).sort((a,b) => b[1]-a[1]).slice(0,8);

  const maxBeh = behEntries.length ? behEntries[0][1] : 1;
  const maxHelp = helpEntries.length ? helpEntries[0][1] : 1;

  return (
    <div className="space-y-6">
      {/* Independence chart */}
      <div className="bg-white rounded-xl border p-4">
        <h3 className="font-semibold text-gray-800 mb-3">Динаміка самостійності</h3>
        <div className="flex items-end gap-1 h-32 overflow-x-auto pb-2">
          {indData.map((d, i) => (
            <div key={i} className="flex flex-col items-center min-w-8">
              <div className="text-xs text-gray-500 mb-1">{d.val}</div>
              <div className="w-6 rounded-t" style={{ height: `${d.val * 20}%`, background: `hsl(${d.val * 30}, 70%, 50%)` }}/>
              <div className="text-xs text-gray-400 mt-1 whitespace-nowrap" style={{fontSize:'9px'}}>{d.date.slice(0,5)}</div>
            </div>
          ))}
        </div>
      </div>

      {/* Subject distribution */}
      <div className="bg-white rounded-xl border p-4">
        <h3 className="font-semibold text-gray-800 mb-3">Предмети (кількість спостережень)</h3>
        <div className="space-y-2">
          {subjEntries.map(([subj, count]) => (
            <div key={subj} className="flex items-center gap-2">
              <span className="text-sm text-gray-600 w-40 truncate">{subj}</span>
              <div className="flex-1 bg-gray-100 rounded-full h-4">
                <div className="bg-blue-500 h-4 rounded-full text-xs text-white flex items-center justify-center" style={{width: `${count/observations.length*100}%`, minWidth:'24px'}}>{count}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Behavior patterns */}
      {behEntries.length > 0 && (
        <div className="bg-white rounded-xl border p-4">
          <h3 className="font-semibold text-gray-800 mb-3">Найчастіші поведінкові прояви</h3>
          <div className="space-y-2">
            {behEntries.map(([beh, count]) => (
              <div key={beh} className="flex items-center gap-2">
                <span className="text-sm text-gray-600 w-48 truncate">{beh}</span>
                <div className="flex-1 bg-gray-100 rounded-full h-4">
                  <div className="bg-red-400 h-4 rounded-full text-xs text-white flex items-center justify-center" style={{width: `${count/maxBeh*100}%`, minWidth:'24px'}}>{count}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* Help patterns */}
      {helpEntries.length > 0 && (
        <div className="bg-white rounded-xl border p-4">
          <h3 className="font-semibold text-gray-800 mb-3">Найчастіші види допомоги</h3>
          <div className="space-y-2">
            {helpEntries.map(([h, count]) => (
              <div key={h} className="flex items-center gap-2">
                <span className="text-sm text-gray-600 w-48 truncate">{h}</span>
                <div className="flex-1 bg-gray-100 rounded-full h-4">
                  <div className="bg-green-400 h-4 rounded-full text-xs text-white flex items-center justify-center" style={{width: `${count/maxHelp*100}%`, minWidth:'24px'}}>{count}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

                <td style={{border:'1px solid #000', padding:'4px'}}>
                  {[...(o.behavior||[]), ...(o.learning||[])].join('; ') || '—'}
                  {o.emotionalState ? `\nСтан: ${o.emotionalState}` : ''}
                  {`\nСамост.: ${o.independence||3}/5`}
                </td>
                <td style={{border:'1px solid #000', padding:'4px'}}>{(o.social||[]).join('; ') || '—'}</td>
                <td style={{border:'1px solid #000', padding:'4px'}}>{(o.helpProvided||[]).join('; ') || '—'}</td>
                <td style={{border:'1px solid #000', padding:'4px'}}>
                  {o.detailedNotes||''}
                  {o.recommendations ? `\nРек.: ${o.recommendations}` : ''}
                </td>
              </tr>
            ))}
          </tbody>
        </table>

        <div style={{display:'flex', justifyContent:'space-between', marginTop:'20mm', fontSize:'11pt'}}>
          <div style={{textAlign:'center'}}>
            <div style={{borderTop:'1px solid #000', width:'200px', marginTop:'30px', paddingTop:'3px'}}>Асистент вчителя</div>
          </div>
          <div style={{textAlign:'center'}}>
            <div style={{borderTop:'1px solid #000', width:'200px', marginTop:'30px', paddingTop:'3px'}}>Директор</div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============ SETTINGS ============
function SettingsPage({ onExport, onImport }) {
  const fileRef = useRef(null);

  const handleImport = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        onImport(data);
        alert('Дані успішно імпортовано!');
      } catch { alert('Помилка читання файлу'); }
    };
    reader.readAsText(file);
  };

  const handleClear = () => {
    if(confirm('Ви впевнені? Усі дані будуть видалені безповоротно!')) {
      localStorage.removeItem('zubraDiary_students');
      localStorage.removeItem('zubraDiary_observations');
      localStorage.removeItem('zubraDiary_settings');
      window.location.reload();
    }
  };

  return (
    <div className="max-w-lg mx-auto space-y-6">
      <div className="bg-white rounded-xl border p-6">
        <h3 className="font-semibold text-gray-800 mb-4">Інформація про заклад</h3>
        <div className="text-sm space-y-2 text-gray-600">
          <p><strong>Назва:</strong> {SCHOOL_NAME}</p>
          <p><strong>Адреса:</strong> {SCHOOL_ADDRESS}</p>
          <p><strong>ЄДРПОУ:</strong> 22373629</p>
          <p><strong>Телефон:</strong> (032) 227-53-33</p>
          <p><strong>Директор:</strong> {SCHOOL_DIRECTOR}</p>
        </div>
      </div>

      <div className="bg-white rounded-xl border p-6">
        <h3 className="font-semibold text-gray-800 mb-4">Резервне копіювання</h3>
        <div className="space-y-3">
          <button onClick={onExport} className="w-full flex items-center justify-center gap-2 bg-green-600 text-white px-4 py-3 rounded-lg hover:bg-green-700 text-sm">
            {Icons.download} Експорт даних (JSON)
          </button>
          <button onClick={() => fileRef.current?.click()} className="w-full flex items-center justify-center gap-2 bg-blue-600 text-white px-4 py-3 rounded-lg hover:bg-blue-700 text-sm">
            {Icons.download} Імпорт даних
          </button>
          <input ref={fileRef} type="file" accept=".json" className="hidden" onChange={handleImport}/>
        </div>
      </div>

      <div className="bg-white rounded-xl border p-6 border-red-200">
        <h3 className="font-semibold text-red-600 mb-4">Небезпечна зона</h3>
        <button onClick={handleClear} className="w-full bg-red-500 text-white px-4 py-3 rounded-lg hover:bg-red-600 text-sm">Очистити всі дані</button>
      </div>
    </div>
  );
}

// ============ MAIN APP ============
function App() {
  const [students, setStudents] = useState(() => Storage.get('students', []));
  const [observations, setObservations] = useState(() => Storage.get('observations', []));
  const [page, setPage] = useState('home');
  const [selectedStudentId, setSelectedStudentId] = useState(null);
  const [showStudentForm, setShowStudentForm] = useState(false);
  const [editStudent, setEditStudent] = useState(null);
  const [showObsForm, setShowObsForm] = useState(false);
  const [editObs, setEditObs] = useState(null);
  const [showPrint, setShowPrint] = useState(false);
  const [mobileMenu, setMobileMenu] = useState(false);

  // Persist
  useEffect(() => { Storage.set('students', students); }, [students]);
  useEffect(() => { Storage.set('observations', observations); }, [observations]);

  // Student CRUD
  const saveStudent = (s) => {
    if (students.find(st => st.id === s.id)) setStudents(students.map(st => st.id === s.id ? s : st));
    else setStudents([...students, s]);
    setShowStudentForm(false); setEditStudent(null);
  };
  const deleteStudent = (id) => {
    setStudents(students.filter(s => s.id !== id));
    setObservations(observations.filter(o => o.studentId !== id));
  };

  // Observation CRUD
  const saveObs = (o) => {
    if (observations.find(ob => ob.id === o.id)) setObservations(observations.map(ob => ob.id === o.id ? o : ob));
    else setObservations([...observations, o]);
    setShowObsForm(false); setEditObs(null);
  };
  const deleteObs = (id) => { setObservations(observations.filter(o => o.id !== id)); };

  // Export/Import
  const exportData = () => {
    const data = { students, observations, exportDate: new Date().toISOString(), school: SCHOOL_NAME };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `diary_backup_${todayStr()}.json`; a.click();
    URL.revokeObjectURL(url);
  };
  const importData = (data) => {
    if (data.students) setStudents(data.students);
    if (data.observations) setObservations(data.observations);
  };

  const selectedStudent = students.find(s => s.id === selectedStudentId);

  // Navigation
  const nav = [
    { id: 'home', label: 'Головна', icon: Icons.home },
    { id: 'students', label: 'Учні', icon: Icons.user },
    { id: 'settings', label: 'Налаштування', icon: Icons.settings },
  ];

  const goToStudent = (id) => { setSelectedStudentId(id); setPage('student'); };

  // Recent observations
  const recentObs = [...observations].sort((a,b) => b.date.localeCompare(a.date)).slice(0,5);

  return (
    <div className="min-h-screen bg-gray-50">
      {/* Header */}
      <header className="bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-lg no-print">
        <div className="max-w-6xl mx-auto px-4 py-3">
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <button className="lg:hidden" onClick={() => setMobileMenu(!mobileMenu)}>{mobileMenu ? Icons.close : Icons.menu}</button>
              <div>
                <h1 className="text-lg font-bold leading-tight">Щоденник спостережень</h1>
                <p className="text-blue-200 text-xs hidden sm:block">{SCHOOL_NAME}</p>
              </div>
            </div>
            <div className="hidden lg:flex items-center gap-1">
              {nav.map(n => (
                <button key={n.id} onClick={() => { setPage(n.id); setSelectedStudentId(null); setShowPrint(false); }}
                  className={`flex items-center gap-2 px-4 py-2 rounded-lg text-sm transition ${page === n.id || (n.id==='students' && page==='student') ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}`}>
                  {n.icon} {n.label}
                </button>
              ))}
            </div>
            <div className="text-right hidden sm:block">
              <div className="text-xs text-blue-200">{formatDate(todayStr())}</div>
              <div className="text-xs text-blue-300">{students.length} учнів | {observations.length} записів</div>
            </div>
          </div>
          {/* Mobile menu */}
          {mobileMenu && (
            <div className="lg:hidden mt-3 pt-3 border-t border-blue-600 space-y-1">
              {nav.map(n => (
                <button key={n.id} onClick={() => { setPage(n.id); setSelectedStudentId(null); setShowPrint(false); setMobileMenu(false); }}
                  className={`w-full flex items-center gap-2 px-3 py-2 rounded-lg text-sm text-left ${page === n.id ? 'bg-white bg-opacity-20' : 'hover:bg-white hover:bg-opacity-10'}`}>
                  {n.icon} {n.label}
                </button>
              ))}
            </div>
          )}
        </div>
      </header>

      {/* Main content */}
      <main className="max-w-6xl mx-auto px-4 py-6">
        {/* HOME */}
        {page === 'home' && (
          <div>
            <div className="bg-white rounded-xl border p-6 mb-6">
              <h2 className="text-xl font-bold text-gray-800 mb-1">{SCHOOL_NAME}</h2>
              <p className="text-sm text-gray-500">{SCHOOL_ADDRESS}</p>
              <p className="text-sm text-gray-500">{SCHOOL_PHONE} | Директор: {SCHOOL_DIRECTOR}</p>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
              <div className="bg-white rounded-xl border p-4 text-center">
                <div className="text-3xl font-bold text-blue-600">{students.length}</div>
                <div className="text-sm text-gray-500">Учнів</div>
              </div>
              <div className="bg-white rounded-xl border p-4 text-center">
                <div className="text-3xl font-bold text-green-600">{observations.length}</div>
                <div className="text-sm text-gray-500">Спостережень</div>
              </div>
              <div className="bg-white rounded-xl border p-4 text-center">
                <div className="text-3xl font-bold text-purple-600">{observations.filter(o => o.date === todayStr()).length}</div>
                <div className="text-sm text-gray-500">Сьогодні</div>
              </div>
              <div className="bg-white rounded-xl border p-4 text-center">
                <div className="text-3xl font-bold text-orange-600">{new Set(observations.filter(o => o.date === todayStr()).map(o => o.studentId)).size}</div>
                <div className="text-sm text-gray-500">Учнів сьогодні</div>
              </div>
            </div>

            {/* Quick actions */}
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
              <button onClick={() => { setPage('students'); }} className="bg-blue-600 text-white p-4 rounded-xl hover:bg-blue-700 flex items-center gap-3 text-left">
                <div className="bg-white bg-opacity-20 rounded-lg p-2">{Icons.user}</div>
                <div><div className="font-semibold">Переглянути учнів</div><div className="text-blue-200 text-sm">Список усіх учнів з ООП</div></div>
              </button>
              <button onClick={() => { setShowStudentForm(true); setEditStudent(null); }} className="bg-green-600 text-white p-4 rounded-xl hover:bg-green-700 flex items-center gap-3 text-left">
                <div className="bg-white bg-opacity-20 rounded-lg p-2">{Icons.plus}</div>
                <div><div className="font-semibold">Додати учня</div><div className="text-green-200 text-sm">Створити нову картку учня</div></div>
              </button>
            </div>

            {/* Recent observations */}
            {recentObs.length > 0 && (
              <div className="bg-white rounded-xl border p-4">
                <h3 className="font-semibold text-gray-800 mb-3">Останні спостереження</h3>
                <div className="space-y-2">
                  {recentObs.map(o => {
                    const st = students.find(s => s.id === o.studentId);
                    if (!st) return null;
                    return (
                      <div key={o.id} onClick={() => goToStudent(o.studentId)} className="flex items-center gap-3 p-2 rounded-lg hover:bg-gray-50 cursor-pointer">
                        <div className="bg-blue-100 rounded-full w-8 h-8 flex items-center justify-center text-blue-600 text-sm font-bold">{st.firstName[0]}</div>
                        <div className="flex-1 min-w-0">
                          <div className="text-sm font-medium text-gray-800 truncate">{st.lastName} {st.firstName}</div>
                          <div className="text-xs text-gray-400">{o.subject} — {formatDate(o.date)}</div>
                        </div>
                        {o.emotionalState && <span className="text-sm">{o.emotionalState.split(' ')[0]}</span>}
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {students.length === 0 && (
              <div className="text-center py-8">
                <p className="text-gray-400">Почніть роботу — додайте першого учня з ООП</p>
              </div>
            )}
          </div>
        )}

        {/* STUDENTS LIST */}
        {page === 'students' && (
          <StudentsPage
            students={students}
            onSelect={goToStudent}
            onAdd={() => { setShowStudentForm(true); setEditStudent(null); }}
            onEdit={(s) => { setShowStudentForm(true); setEditStudent(s); }}
            onDelete={deleteStudent}
          />
        )}

        {/* STUDENT DETAIL */}
        {page === 'student' && selectedStudent && !showPrint && (
          <StudentDetail
            student={selectedStudent}
            observations={observations}
            onBack={() => { setPage('students'); setSelectedStudentId(null); }}
            onAddObs={() => { setShowObsForm(true); setEditObs(null); }}
            onQuickObs={() => { setEditObs(makeRandomObs(selectedStudentId)); setShowObsForm(true); }}
            onEditObs={(o) => { setShowObsForm(true); setEditObs(o); }}
            onDeleteObs={deleteObs}
            onPrint={() => setShowPrint(true)}
          />
        )}

        {/* PRINT REPORT */}
        {page === 'student' && selectedStudent && showPrint && (
          <PrintReport
            student={selectedStudent}
            observations={observations.filter(o => o.studentId === selectedStudent.id)}
            onClose={() => setShowPrint(false)}
          />
        )}

        {/* SETTINGS */}
        {page === 'settings' && (
          <SettingsPage onExport={exportData} onImport={importData}/>
        )}
      </main>

      {/* Footer */}
      <footer className="text-center py-4 text-xs text-gray-400 no-print">
        <p>{SCHOOL_NAME} &bull; Електронний щоденник спостережень за дітьми з ООП</p>
        <p>Навчальний рік 2025–2026</p>
      </footer>

      {/* Student Modal */}
      <Modal open={showStudentForm} onClose={() => { setShowStudentForm(false); setEditStudent(null); }} title={editStudent ? 'Редагувати учня' : 'Додати нового учня'} wide>
        <StudentForm student={editStudent} onSave={saveStudent} onClose={() => { setShowStudentForm(false); setEditStudent(null); }}/>
      </Modal>

      {/* Observation Modal */}
      <Modal open={showObsForm} onClose={() => { setShowObsForm(false); setEditObs(null); }} title={editObs ? 'Редагувати спостереження' : 'Нове спостереження'} wide>
        <ObservationForm obs={editObs} studentId={selectedStudentId} onSave={saveObs} onClose={() => { setShowObsForm(false); setEditObs(null); }}/>
      </Modal>
    </div>
  );
}

ReactDOM.render(<App/>, document.getElementById('root'));
</script>
</body>
</html>
